# Compare dogelib-oracle with Dogecoin Core on the same requests.
#
# The harness, harness/core/core_oracle.cpp, is built against Core's own
# libraries at the commit that SOURCES.md pins. It links Core's server library
# and compiles Core's validation.cpp. scripts/compare_core.py runs
# both programs and requires their responses to agree (docs/core-harness.md).

name: core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Dogecoin Core v1.14.9, the commit that SOURCES.md pins.
  CORE_PIN: e0a1c157791544e818c901bd9341896965afbf9d

# The checks run in five jobs at the same time, each on its own runner. Each
# job builds the oracle, and compare, csv-forced, and impact build the harness
# from the shared cache.
jobs:
  # The comparator's own failure paths. It needs the oracle, not the harness.
  self-test:
    runs-on: ubuntu-24.04
    # The comparator self-test took 10 to 19 minutes on four cores.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/core-setup
        with:
          harness: false

      # The comparison must be able to fail: a passing control on the full
      # stream, then one case for each planted mutation on a reduced stream.
      # The cases run four at a time, and each line gives the case's time.
      - name: comparator self-test
        if: ${{ !cancelled() }}
        run: python3 -I scripts/test_compare_core.py .lake/build/bin/dogelib-oracle

      # The all-seeds run is outside CI. Its failure paths are tested here.
      - name: subsidy seeds self-test
        if: ${{ !cancelled() }}
        run: python3 -I scripts/test_compare_subsidy_seeds.py .lake/build/bin/dogelib-oracle

  compare:
    runs-on: ubuntu-24.04
    # A run with an empty cache takes about 5 more minutes for Boost and
    # Core's libraries.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/core-setup

      - name: signed-spend regeneration
        run: python3 -I scripts/check_signed_spends.py build/core-harness/core-signer

      # Design record 0009, stage 5: the generated campaign at a seed whose
      # results a person reviewed. A fresh seed runs only on a contributor's
      # machine (SECURITY.md). Saved failures stay in the runner's build/.
      - name: campaign at the reviewed seed
        if: ${{ !cancelled() }}
        run: time python3 -I scripts/campaign.py run --campaign generated --signer build/core-harness/core-signer --seed 20261108 --cases 3000 --seconds 600 --batch-size 64 --output build/campaign/generated .lake/build/bin/dogelib-oracle build/core-harness/core-oracle

      # The harness keeps no adjusted time between requests.
      - name: harness state between requests
        if: ${{ !cancelled() }}
        run: python3 -I scripts/test_core_harness.py .lake/build/bin/dogelib-oracle build/core-harness/core-oracle

      - name: native Rust CompactSize adapter
        run: |
          rustup toolchain install nightly-2026-09-17 --profile minimal
          time cargo +nightly-2026-09-17 build --locked --manifest-path Refinement/Rust/Cargo.toml --example compactsize_oracle --jobs 4

      - name: CompactSize three-way comparison
        run: time python3 -I scripts/compare_core.py --rust-compactsize Refinement/Rust/target/debug/examples/compactsize_oracle .lake/build/bin/dogelib-oracle build/core-harness/core-oracle

      - name: compare
        if: ${{ !cancelled() }}
        run: python3 -I scripts/compare_core.py .lake/build/bin/dogelib-oracle build/core-harness/core-oracle

      # Design record 0010, decision 2: mainnet blocks 0 to 10,000 and 1,000
      # recent blocks are assets of a GitHub release. The first command
      # downloads them and requires the SHA-256 values of
      # tests/block/mainnet-blocks/release.json. The second runs block.check
      # with both flags on every block.
      - name: mainnet block ranges
        if: ${{ !cancelled() }}
        run: |
          time python3 -I scripts/fetch_release_blocks.py
          time python3 -I scripts/compare_core.py --mainnet-blocks build/mainnet-blocks .lake/build/bin/dogelib-oracle build/core-harness/core-oracle

      # The replay to height 145,000 is outside CI. Its tool runs here on
      # heights 0 to 200 of the downloaded range, with planted faults, and
      # both programs read small files through blocks_file.
      - name: replay tool self-test
        if: ${{ !cancelled() }}
        run: python3 -I scripts/test_replay_blocks.py .lake/build/bin/dogelib-oracle build/core-harness/core-oracle build/mainnet-blocks

      # Design record 0011, stage 1, exit condition 5: the snapshot path on
      # the downloaded heights 0 to 10,000. Core writes the coin-set snapshot
      # at height 9,000, and both programs run heights 9,001 to 10,000 from
      # it. Changed snapshots must fail.
      - name: snapshot range, short form
        if: ${{ !cancelled() }}
        run: time python3 -I scripts/snapshot_range.py --start 9000 --end 10000 --output build/snapshot-range/short .lake/build/bin/dogelib-oracle build/core-harness/core-oracle build/mainnet-blocks/genesis-10000

      # Design record 0011, stage 2: the harness arguments of the Core pass
      # and scripts/core_pass.py. Core's version-bits state through a
      # synthetic CSV window, the coin set in CCoinsViewDB, a pass of heights
      # 0 to 10,000 in segments with a restart, hash_serialized, and the
      # build that traps a signed overflow.
      - name: Core pass self-test
        if: ${{ !cancelled() }}
        run: time python3 -I scripts/test_core_pass.py .lake/build/bin/dogelib-oracle build/core-harness/core-oracle build/core-harness/core-oracle-trap build/mainnet-blocks/genesis-10000

  # The proposed revision against Core's dormant code. The replay of mainnet
  # heights 0 to 10,000 through the proposal oracle is most of this job.
  csv-forced:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/core-setup

      - name: fetch the mainnet block ranges
        run: time python3 -I scripts/fetch_release_blocks.py

      # Design record 0012, stage 1: the proposed revision RelativeLockTime against
      # Core's own dormant code. The harness seeds THRESHOLD_ACTIVE for CSV, a state
      # that no mainnet chain reaches (csv_never_lockedIn), so this step is not a
      # Core comparison of the baseline. The first command checks the committed
      # candidate list of the cutoff count. Stage 3 adds block.validate with the
      # seed on made blocks for the sequence locks of BIP 68, and on mainnet
      # heights 0 to 10,000 in one request, which takes about 15 minutes.
      - name: CSV forced active, against the proposed revision
        if: ${{ !cancelled() }}
        run: |
          lake build dogelib-proposal-oracle
          python3 -I scripts/relative_lock_time_candidates.py --check
          time python3 -I scripts/compare_csv_forced.py .lake/build/bin/dogelib-oracle .lake/build/bin/dogelib-proposal-oracle build/core-harness/core-oracle

  # The historical impact runs of design record 0011, section 10.3, and design
  # record 0012, section 10.3. The candidate lists are committed before the
  # runs, and scripts/impact_run.py refuses a list that is not committed. Every
  # list of these ranges is empty, so no block may change. The revised verdicts
  # have no Core comparison: the harness only writes the snapshot at 9,000.
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/core-setup

      - name: fetch the mainnet block ranges
        run: time python3 -I scripts/fetch_release_blocks.py

      # Made blocks with a planted candidate of each kind, through the code
      # path of the ranges, and planted faults of the run check. The test
      # build proposal-test-oracle also names the two examples of the framework.
      - name: impact tools self-test
        if: ${{ !cancelled() }}
        run: |
          lake build dogelib-proposal-oracle proposal-test-oracle
          python3 -I scripts/test_impact.py .lake/build/bin/proposal-test-oracle

      # Design record 0012, stage 4, exit condition 2: RelativeLockTime active
      # from height 1 on heights 0 to 10,000, from the empty set.
      - name: impact run, heights 0 to 10,000
        if: ${{ !cancelled() }}
        run: |
          python3 -I scripts/impact_run.py request --range genesis-10000 --fixture build/mainnet-blocks/genesis-10000 --output build/impact/requests/genesis-10000
          python3 -I scripts/impact_candidates.py --range genesis-10000 --request build/impact/requests/genesis-10000/request.json --check
          time python3 -I scripts/impact_run.py run --range genesis-10000 --request build/impact/requests/genesis-10000/request.json --revision RelativeLockTime --activation 1 --output build/impact/runs/genesis-10000 .lake/build/bin/dogelib-proposal-oracle

      # Design record 0011, stage 6, cases 1 and 2 of section 10.3 for both
      # examples on the short range, heights 9,001 to 10,000 from the snapshot
      # at 9,000. Without revision the proposal executable writes the bytes of
      # dogelib-oracle on that coins_file request. The examples run through
      # the test build proposal-test-oracle, because the shipped executable
      # names only proposed revisions.
      - name: impact runs, short range
        if: ${{ !cancelled() }}
        run: |
          python3 -I scripts/impact_run.py request --range short --fixture build/mainnet-blocks/genesis-10000 --harness build/core-harness/core-oracle --output build/impact/requests/short
          python3 -I scripts/impact_candidates.py --range short --request build/impact/requests/short/request.json --check
          time python3 -I scripts/test_proposal_oracle.py --snapshot-request build/impact/requests/short/request.json .lake/build/bin/dogelib-oracle .lake/build/bin/dogelib-proposal-oracle .lake/build/bin/proposal-test-oracle
          for run in "ExampleVersionVerify none" "ExampleVersionVerify 0" "ExampleFaultyLocktime/corrected none" "ExampleFaultyLocktime/corrected 0"; do
            set -- $run
            time python3 -I scripts/impact_run.py run --range short --request build/impact/requests/short/request.json --revision "$1" --activation "$2" --output "build/impact/runs/short/${1%%/*}-$2" .lake/build/bin/proposal-test-oracle
          done

  # Design record 0011, stage 5, exit condition 5: the oracle runs two ranges
  # of the conformance corpus from the released assets, and the checker
  # compares its results with the committed expected results, which are the
  # Core harness's results (docs/conformance.md). The job builds no harness.
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/core-setup
        with:
          harness: false

      - name: fetch the corpus ranges short and D
        run: time python3 -I scripts/conformance.py fetch short D

      - name: conformance ranges short and D
        run: |
          for range in short D; do
            time python3 -I scripts/range_results.py --range "$range" --request "build/conformance/$range/request.json" --blocks "build/conformance/$range/fixture/blocks.bin" --output "build/conformance/$range/results.jsonl" .lake/build/bin/dogelib-oracle
            python3 -I scripts/check_range_results.py "build/conformance/$range/results.jsonl" "tests/conformance/ranges/$range/expected.jsonl"
          done
