# Compare dogelib-oracle with Dogecoin Core on the same requests.
#
# The harness, harness/core/core_oracle.cpp, is built against Core's own
# libraries at the commit that SOURCES.md pins. scripts/compare_core.py runs
# both programs and requires their responses to agree (docs/oracle.md, "The
# Core harness").

name: core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Dogecoin Core v1.14.9, the commit that SOURCES.md pins.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: dogecoin/dogecoin
          ref: e0a1c157791544e818c901bd9341896965afbf9d
          path: core-src
          fetch-depth: 1
          persist-credentials: false

      - name: build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config libssl-dev

      # The build script checks its stamp (pin, script, compilers, flags) and
      # rebuilds the Core libraries when a restored cache does not match.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/core-harness
          key: core-harness-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_core_harness.sh') }}

      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: oracle
        run: lake build dogelib-oracle

      - name: harness
        run: bash scripts/build_core_harness.sh core-src build/core-harness

      # The comparison must be able to fail: a passing control, then one
      # mutation for each failure code.
      - name: comparator self-test
        run: python3 -I scripts/test_compare_core.py .lake/build/bin/dogelib-oracle

      - name: compare
        if: ${{ !cancelled() }}
        run: python3 -I scripts/compare_core.py .lake/build/bin/dogelib-oracle build/core-harness/core-oracle
