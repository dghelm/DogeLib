# Compare dogelib-oracle with Dogecoin Core on the same requests.
#
# The harness, harness/core/core_oracle.cpp, is built against Core's own
# libraries at the commit that SOURCES.md pins. It links Core's server library
# and compiles Core's validation.cpp. scripts/compare_core.py runs
# both programs and requires their responses to agree (docs/oracle.md, "The
# Core harness").

name: core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Dogecoin Core v1.14.9, the commit that SOURCES.md pins.
  CORE_PIN: e0a1c157791544e818c901bd9341896965afbf9d

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: dogecoin/dogecoin
          ref: ${{ env.CORE_PIN }}
          path: core-src
          fetch-depth: 1
          persist-credentials: false

      - name: build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config curl bzip2 libssl-dev libevent-dev

      # The cache holds Boost 1.70.0 and Core's libraries. The build script
      # checks its stamp (pin, scripts, compilers, flags) and rebuilds them
      # when a restored cache does not match.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/core-harness
          key: core-harness-${{ runner.os }}-${{ runner.arch }}-${{ env.CORE_PIN }}-${{ hashFiles('scripts/build_core_harness.sh', 'scripts/core_boost.sh') }}

      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: oracle
        run: lake build dogelib-oracle

      - name: harness
        run: time JOBS=4 bash scripts/build_core_harness.sh core-src build/core-harness

      - name: signed-spend regeneration
        run: python3 -I scripts/check_signed_spends.py build/core-harness/core-signer

      # Design record 0009, stage 5: the generated campaign at a seed whose
      # results a person reviewed. A fresh seed runs only on a contributor's
      # machine (SECURITY.md). Saved failures stay in the runner's build/.
      - name: campaign at the reviewed seed
        if: ${{ !cancelled() }}
        run: time python3 -I scripts/campaign.py run --campaign generated --signer build/core-harness/core-signer --seed 20261108 --cases 3000 --seconds 600 --batch-size 64 --output build/campaign/generated .lake/build/bin/dogelib-oracle build/core-harness/core-oracle

      # The comparison must be able to fail: a passing control, then one
      # mutation for each failure code.
      - name: comparator self-test
        if: ${{ !cancelled() }}
        run: python3 -I scripts/test_compare_core.py .lake/build/bin/dogelib-oracle

      - name: native Rust CompactSize adapter
        run: |
          rustup toolchain install nightly-2026-09-17 --profile minimal
          time cargo +nightly-2026-09-17 build --locked --manifest-path Refinement/Rust/Cargo.toml --example compactsize_oracle --jobs 4

      - name: CompactSize three-way comparison
        run: time python3 -I scripts/compare_core.py --rust-compactsize Refinement/Rust/target/debug/examples/compactsize_oracle .lake/build/bin/dogelib-oracle build/core-harness/core-oracle

      - name: compare
        if: ${{ !cancelled() }}
        run: python3 -I scripts/compare_core.py .lake/build/bin/dogelib-oracle build/core-harness/core-oracle
