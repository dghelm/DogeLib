# Preserve release validation commands, revisions, results and complete logs.
name: validation

on:
  workflow_dispatch:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: dogecoin/dogecoin
          ref: e0a1c157791544e818c901bd9341896965afbf9d
          path: build/core-src
          persist-credentials: false

      - name: build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config libssl-dev libboost-dev

      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: refinement dependencies
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake -d Refinement update
          git diff --exit-code Refinement/lake-manifest.json

      - name: Aeneas backend cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Refinement/.lake/packages/aeneas/backends/lean/.lake/build
          key: aeneas-${{ runner.os }}-${{ runner.arch }}-d1e177bb9fdc17fa62e730d524ac905ba19776ed-${{ hashFiles('lean-toolchain', 'Refinement/lean-toolchain', 'Refinement/lake-manifest.json') }}

      - name: Mathlib cache
        run: lake -d Refinement exe cache get

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: false

      # A tag checkout has origin/main but may have no local main branch.
      - name: writing base
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - name: Rust extraction tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            ~/.rustup/toolchains/nightly-2026-09-17-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/nightly-2026-09-17-x86_64-unknown-linux-gnu
          key: rust-extraction-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-17-${{ hashFiles('Refinement/Rust/setup-tools.sh') }}

      - name: pinned extraction tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: Refinement/Rust/setup-tools.sh

      - name: validation report
        run: python3 -I scripts/validation_report.py --core-clone build/core-src --output build/validation/report.md

      - name: upload report and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ github.sha }}
          path: build/validation/
          if-no-files-found: error
