# Build the specification and its proofs, check their compiled declarations,
# run native Rust tests and extraction freshness, and test repository tools.
#
# Adapted from EthLib's ci.yml at commit 6a93711 (CC0 1.0), with the same
# pinned actions. Mathlib supplies cached artifacts for the Rust refinement.
# The current EthLib pin bb6dfe5 changes its caching, actions and checks.
# DogeLib retains this workflow adaptation instead of those upstream changes.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Installs elan and the toolchain that lean-toolchain pins.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: refinement dependencies
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake -d Refinement update
          git diff --exit-code Refinement/lake-manifest.json

      - name: Aeneas backend cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Refinement/.lake/packages/aeneas/backends/lean/.lake/build
          key: aeneas-${{ runner.os }}-${{ runner.arch }}-d1e177bb9fdc17fa62e730d524ac905ba19776ed-${{ hashFiles('lean-toolchain', 'Refinement/lean-toolchain', 'Refinement/lake-manifest.json') }}

      - name: Mathlib cache
        run: lake -d Refinement exe cache get

      # An unfinished proof only warns, so warnings have to be fatal.
      - name: build
        run: lake build --wfail

      - name: refinement build
        run: lake -d Refinement build --wfail

      - name: import boundaries
        run: lake env lean --run scripts/CheckRefinementImports.lean

      # A baseline module that imports a proposed revision must fail the check.
      - name: import boundary fixtures
        if: ${{ !cancelled() }}
        run: bash scripts/test_import_boundaries.sh

      # Every compiled declaration: its axioms, and anything the kernel cannot
      # unfold or the compiler runs differently. Only the findings listed in
      # scripts/check_decls_baseline.txt pass, and that list is empty.
      - name: declarations
        if: ${{ !cancelled() }}
        run: lake exe check-decls

      # The check must report exactly what its fixtures plant.
      - name: declaration check fixtures
        if: ${{ !cancelled() }}
        run: bash scripts/test_check_decls.sh

      # Known answers from independent sources, through the compiled code.
      - name: known answers
        if: ${{ !cancelled() }}
        run: lake test

      # The oracle through its standard input and output: fixtures, Core's
      # signature-hash and transaction corpora, and line-by-line answers.
      - name: oracle
        if: ${{ !cancelled() }}
        run: bash scripts/test_oracle.sh

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Rust extraction tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tools
            ~/.rustup/toolchains/nightly-2026-09-17-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/nightly-2026-09-17-x86_64-unknown-linux-gnu
          key: rust-extraction-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-17-${{ hashFiles('Refinement/Rust/setup-tools.sh') }}

      - name: pinned extraction tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: Refinement/Rust/setup-tools.sh

      - name: Rust known answers
        run: cargo +nightly-2026-09-17 test --locked --manifest-path Refinement/Rust/Cargo.toml --jobs 4

      - name: Rust extraction freshness
        if: ${{ !cancelled() }}
        run: Refinement/Rust/regenerate.sh --check

  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: lane tool
        run: bash scripts/test_lane.sh

      - name: validation report tests
        if: ${{ !cancelled() }}
        run: python3 -I scripts/test_validation_report.py

      # Every vendored vector file must match its pinned digest.
      - name: pinned vectors
        if: ${{ !cancelled() }}
        run: |
          (cd tests/cryptography/secp256k1 && sha256sum -c SHA256SUMS)
          (cd tests/cryptography/ripemd160 && sha256sum -c SHA256SUMS)
          (cd tests/cryptography/sha1/cavp && sha256sum -c SHA256SUMS)
          (cd tests/cryptography/sha256/cavp && sha256sum -c SHA256SUMS)
          (cd tests/transaction/sighash && sha256sum -c SHA256SUMS)
          (cd tests/transaction/corpus && sha256sum -c SHA256SUMS)
          (cd tests/work/mainnet-genesis-headers && sha256sum -c SHA256SUMS)
          (cd tests/work/mainnet-headers && sha256sum -c SHA256SUMS)
          (cd tests/block && sha256sum -c SHA256SUMS)
          (cd tests/block/mainnet-auxpow-activation-headers && sha256sum -c SHA256SUMS)
          (cd tests/block/mainnet-bip65-headers && sha256sum -c SHA256SUMS)
          (cd tests/block/mainnet-bip66-headers && sha256sum -c SHA256SUMS)
          (cd tests/block/mainnet-auxpow-activation-full-headers && sha256sum -c SHA256SUMS)
          (cd tests/block/mainnet-bip65-full-headers && sha256sum -c SHA256SUMS)
          (cd tests/block/mainnet-bip66-full-headers && sha256sum -c SHA256SUMS)
          (cd tests/block/mainnet-subsidy-prev-hashes && sha256sum -c SHA256SUMS)
          (cd tests/block/regtest-header-sequences && sha256sum -c SHA256SUMS)
          (cd tests/script/campaign && sha256sum -c SHA256SUMS)
          (cd tests/script/corpus && sha256sum -c SHA256SUMS)
          (cd tests/script/signed-spends && sha256sum -c SHA256SUMS)

      - name: full-header fixture check
        if: ${{ !cancelled() }}
        run: python3 -I scripts/check_full_headers.py

      - name: header-sequence regeneration
        if: ${{ !cancelled() }}
        run: python3 -I scripts/generate_header_sequences.py --check

      - name: script corpus freshness
        if: ${{ !cancelled() }}
        run: python3 -I scripts/convert_script_tests.py --check

      - name: script corpus converter tests
        if: ${{ !cancelled() }}
        run: python3 -I scripts/test_convert_script_tests.py
