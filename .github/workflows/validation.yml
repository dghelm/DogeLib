# Preserve release validation commands, revisions, results and complete logs.
name: validation

on:
  workflow_dispatch:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: dogecoin/dogecoin
          ref: e0a1c157791544e818c901bd9341896965afbf9d
          path: build/core-src
          persist-credentials: false

      - name: build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config libssl-dev

      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: false

      # A tag checkout has origin/main but may have no local main branch.
      - name: writing base
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - name: validation report
        # Rust extraction and fixtures require the local pinned tools.
        # The report records these two gates as not run in CI.
        run: |
          gates=$(python3 -I scripts/validation_report.py --list | cut -d: -f1 | rg -v '^(rust-known-answers|rust-extraction-freshness)$' | paste -sd,)
          python3 -I scripts/validation_report.py --gates "$gates" --core-clone build/core-src --output build/validation/report.md

      - name: upload report and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ github.sha }}
          path: build/validation/
          if-no-files-found: error
